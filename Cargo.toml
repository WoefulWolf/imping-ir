[package]
name = "imping-ir"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["WoefulWolf"]
repository = "https://github.com/WoefulWolf/imping-ir"
description = "Intermediate representation types and JSON Schema for the imping toolkit."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Optional, so crates that only read IR don't pull it in.
schemars = { version = "1", optional = true }

[features]
default = []
# Derives and emits the JSON Schema.
schema = ["dep:schemars"]

[lints.rust]
missing_docs = "warn"
